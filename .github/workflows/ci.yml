name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow").
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head
  # that has been superseded is answering a question nobody is asking any
  # more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with
  # no verdict is a hole nobody comes back to fill: the next commit contains
  # it, so the code does get tested eventually, but once that run is red
  # there is no longer any way to say which of the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress
  # off, is what makes that hold for more than two pushes: a group keeps at
  # most one run *pending*, so a third push discards the second before it
  # ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # windows-latest, like Ratatoskr, Hermod and Styx. Here the reason is
    # inherited twice over rather than our own: a console application is
    # platform-neutral, but it builds Ratatoskr, and that one builds Hermod,
    # which pulls in System.Diagnostics.PerformanceCounter, System.IO.Ports and
    # System.Drawing.Common. Linux has since been seen to pass in the
    # XMPPConformanceTests suite, which builds the same chain on Debian 13, so
    # a second matrix entry here is now a question of cost rather than of doubt.
    runs-on: windows-latest
    steps:
      # Before the checkout, not after: the submodules are fetched by that step,
      # and Hermod carries FontAwesome icon files whose paths exceed MAX_PATH
      # once nested under the runner's workspace and libs/Hermod. Without this
      # the submodule checkout fails with "Filename too long" and leaves the
      # working tree half-populated.
      - name: Allow long paths
        run: git config --system core.longpaths true

      # One checkout, which is the whole build: libs/ pins Styx, Hermod and
      # Ratatoskr, and the gate therefore tests the set a fresh
      # `git clone --recurse-submodules` produces. This briefly checked out four
      # repositories side by side instead, against their current master - an
      # honest signal, but one that turned this red for changes nobody here had
      # made, and it asked whoever cloned the repository to work the layout out
      # from a restore error.
      #
      # `true` rather than `recursive`: none of the three carries submodules of
      # its own, so today they do the same thing, and `true` cannot quietly grow
      # a second copy of anything if one is added below.
      #
      # What is given up is real and belongs here rather than in a commit
      # message nobody reads twice: a pinned build does not notice a breaking
      # change upstream. XMPPConformanceTests' nightly builds this chain at
      # master and is where that question gets asked.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The test project is the root of everything: building it builds the
      # console, and under that Ratatoskr, Hermod and Styx.
      - name: Build
        run: dotnet build XMPPConsole.Tests/XMPPConsole.Tests.csproj --configuration Release

      # Two questions, and both are things that can be got wrong invisibly.
      #
      # Does the input line survive an output that comes unasked - the console
      # writes while somebody is typing, and a broken prompt is only ever seen
      # by the person it happened to.
      #
      # And what does a JID become once it is a directory name. The chat log
      # turns a name a stranger chose into a path and an incoming message into
      # a download, so the tests are about the cases a stranger picks: a
      # resource called '..\..\Windows', a link inside a sentence.
      #
      # The protocol is not checked in this gate - that suite lives with
      # Ratatoskr, and everything needing a foreign implementation lives in
      # XMPPConformanceTests. Both have gates of their own. Reading and
      # decrypting an aesgcm:// URL is checked there too, since D107 moved it
      # where it belongs; what stays here is only whether to fetch at all.
      #
      # Expect 21 passed, 0 skipped. Read anything skipped as a question, not
      # as noise: the number of skipped tests is the only thing that tells a
      # run which measured something from one which measured nothing.
      - name: Test
        timeout-minutes: 15
        run: dotnet test XMPPConsole.Tests/XMPPConsole.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
